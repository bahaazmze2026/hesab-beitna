name: Android build and checks
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Pure Java acceptance checks
        run: |
          bash tools/check-finance.sh
          python3 tools/check-project.py
      - name: Tests, lint and installable debug APK
        run: gradle --no-daemon -PpreviewVersionCode=9 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Fetch delivered 1.6.1 APK for real update acceptance
        uses: actions/download-artifact@v4
        with:
          name: hesab-beitna-apk-and-reports
          path: qa/previous-delivery
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bahaazmze2026/hesab-beitna
          run-id: 37079032310
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android persistence and UI acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash tools/run-ui-qa.sh
      - name: Build release APK and provide local signing tool
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            python3 - <<'PY'
          import os, base64, pathlib
          pathlib.Path('owner.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_B64']))
          def prop(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          values = {'storeFile':'owner.jks','storePassword':os.environ['STORE_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS'],'keyPassword':os.environ['KEY_PASSWORD']}
          pathlib.Path('signing.properties').write_text('\n'.join(k+'='+prop(v) for k,v in values.items()), encoding='utf-8')
          PY
          elif [ -f tools/bootstrap-release-once ]; then
            bash tools/bootstrap-signing.sh tools/signing-recovery-public.pem owner-signing
          fi
          if [ -f signing.properties ]; then
            gradle --no-daemon assembleRelease
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
            mkdir -p qa
            cp app/build/outputs/apk/release/app-release.apk qa/meow-budget-1.6.2.apk
            sha256sum qa/meow-budget-1.6.2.apk > qa/meow-budget-1.6.2.sha256
          else
            gradle --no-daemon assembleRelease
            mkdir -p qa
            cp app/build/outputs/apk/release/app-release-unsigned.apk qa/hesab-beitna-unsigned.apk
          fi
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" qa/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('owner-signing/owner.jks') != ''
        with:
          name: owner-signing-encrypted
          path: |
            owner-signing/owner.jks
            owner-signing/owner-password.rsa
      - name: Remove downloaded baseline reports before final artifact upload
        if: always()
        run: rm -rf qa/previous-delivery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hesab-beitna-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/
            qa/
      - name: Remove signing materials
        if: always()
        run: |
          rm -f owner.jks signing.properties
          rm -rf owner-signing
